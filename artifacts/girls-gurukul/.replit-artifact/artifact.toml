kind = "web"
previewPath = "/"
title = "The Girls Gurukul - School Website"
version = "1.0.0"
id = "artifacts/girls-gurukul"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5173

[services.development]
run = "pnpm --filter @workspace/girls-gurukul run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/girls-gurukul", "run", "build" ]
publicDir = "artifacts/girls-gurukul/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/"
